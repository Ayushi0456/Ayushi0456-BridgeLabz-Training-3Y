<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <td><title>Student Registration Form</title></td>
</head>
<body>
    <h1 align = "center"> Student Registration Form </h1>
    <table border = "1" cellpadding = "10" cellspacing = "0" width = 100%>
        <tr>
        <th colspan = "2"> Registration Form </th>
        </tr>
        <tr>
        <td> Full Name</td>
        <td><input type = "text" placeholder = "Enter your name"></td>
        </tr>
        <tr>
         <td> Email </td>
        <td><input type = "email" placeholder = "Enter your email"></td>
        </tr>
        <tr>
        <td> Phone Number </td>
        <td> <input type = "phone" placeholder = "Enter your number"></td>
        </tr>
        <tr>
        <td> Date Of Birth </td>
        <td><label></label>
        <input id = "date" type = "date"></td><br>
        <br>
        </tr>
        <tr>
            <td>Gender</td>
            <td>
            <section>
            <label></label>
            <input type = "radio" name = "Gender">
            <label> Male </label>
            <input type = "radio" name = "Gender">
            <label> Female </label>
            <input type = "radio" name = "Gender">
            <label> Other </label>
            
            </section>
            </td>
        
        </tr>
        <tr>
        <td> Skills </td>
        <td>
            <label></label>
        <section>
            <input id = "html" type = "checkbox">
            <label for = "html" > HTML</label>
            <input id = "css" type = "checkbox">
            <label for = "css" > CSS </label>
            <input id = "java" type = "checkbox">
            <label for = "css" > JAVA </label>
        </section>
        </td>
        </tr>

        <td> Course</td>
        <td>
        
        <select name = "Course" required>
            <option value ="" disabled selected hidden> Select your course</option>
            <option>B.Tech </option>
            <option> BBA </option>
            <option> BSC </option>
            <option> MA </option>
            <option> BCOM </option>
        </select>
        </td>
        </tr>

        <tr>
        <td>Address</td>
        <td><textarea rows = "4" cols = "30" ></textarea></td>
        </tr>

        <tr>
        <td>Upload Resume</td>
        <td><input type="file" name="file"></td>
        </tr>

        <tr>
        <td colspan="2" align = "center">
        <input type="submit" value="Register">
        <input type="reset" value="Reset">
        </td>
        </tr>



    </table>
    
</body>
</html>
