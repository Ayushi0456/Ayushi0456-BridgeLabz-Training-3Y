<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Photo Gallery</h1>
    </header>

    <main class="gallery">

        <div class="photo">
            <img src="https://picsum.photos/500/400?random=1" alt="Nature">
            <div class="caption">Beautiful Nature</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/500/400?random=2" alt="Mountain">
            <div class="caption">Mountain View</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/500/400?random=3" alt="Beach">
            <div class="caption">Beautiful Beach</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/500/400?random=4" alt="City">
            <div class="caption">City Life</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/500/400?random=5" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/500/400?random=6" alt="Travel">
            <div class="caption">Travel Memories</div>
        </div>

    </main>

</body>
</html>
