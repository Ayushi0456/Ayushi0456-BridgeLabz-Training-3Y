<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fixed Header -->
    <header>
        <h1>My Dashboard</h1>
    </header>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside>
            <h2>Menu</h2>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Projects</a>
                <a href="#">Settings</a>
                <a href="#">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main>

            <h2>Dashboard Overview</h2>

            <div class="content-container">

                <div class="box">
                    <h3>Total Projects</h3>
                    <p>25</p>
                </div>

                <div class="box">
                    <h3>Completed Tasks</h3>
                    <p>120</p>
                </div>

                <div class="box">
                    <h3>Pending Tasks</h3>
                    <p>15</p>
                </div>

                <div class="box">
                    <h3>Team Members</h3>
                    <p>10</p>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
