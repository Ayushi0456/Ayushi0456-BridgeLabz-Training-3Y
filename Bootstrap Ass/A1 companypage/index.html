<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaTech - Company Landing Page</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="q1.css">
</head>

<body>

    <!-- Header section -->
    <header>

        <!-- Bootstrap navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">

                <!-- Company name -->
                <a class="navbar-brand fw-bold" href="#">NovaTech</a>

                <!-- Mobile navbar button -->
                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navbar links -->
                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link active" href="#">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Services</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>

    </header>


    <!-- Main content -->
    <main>

        <!-- Hero section -->
        <section class="hero-section">

            <!-- Bootstrap container keeps content aligned -->
            <div class="container">

                <!-- Bootstrap row -->
                <div class="row justify-content-center align-items-center">

                    <!-- Bootstrap column -->
                    <div class="col-12 col-md-10 col-lg-8 text-center">

                        <h1 class="display-3 fw-bold">
                            Build Something Amazing
                        </h1>

                        <p class="lead">
                            We create simple, powerful and innovative digital
                            solutions for modern businesses.
                        </p>

                        <!-- Bootstrap button -->
                        <a href="#" class="btn btn-primary btn-lg mt-3">
                            Get Started
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">

        <p class="mb-0">
            &copy; 2026 NovaTech. All Rights Reserved.
        </p>

    </footer>


    <!-- Bootstrap JavaScript bundle
         Required for the responsive navbar toggle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
