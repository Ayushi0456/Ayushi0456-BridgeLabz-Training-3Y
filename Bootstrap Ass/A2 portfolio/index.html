<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="q2.css">
</head>

<body>

    <!-- Header -->
    <header class="bg-light text-dark text-center p-5">
        <div class="container">

            <h1 class="fw-bold">
                Ayushi
            </h1>

            <p class="lead mb-0">
                AI & Data Science Enthusiast | Web Developer
            </p>

        </div>
    </header>


    <!-- Main content -->
    <main>

        <section class="container text-center mt-4 mb-3">

            <!-- Profile image -->
            <img
                src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=300&q=80"
                alt="Profile Photo"
                class="img-fluid rounded-circle profile-image"
            >

            <h2 class="fw-bold mt-4">
                Hello, I'm Ayushi
            </h2>

            <p class="text-muted">
                I love building creative websites and learning
                Artificial Intelligence, Data Science and Machine Learning.
            </p>


            <!-- Buttons -->
            <div class="mt-4 mb-4">

                <a href="#" class="btn btn-primary me-2">
                    Hire Me
                </a>

                <a href="#" class="btn btn-outline-dark">
                    Download CV
                </a>

            </div>


            <!-- Contact form -->
            <div class="contact-box bg-light p-5 mt-4">

                <h3 class="fw-bold mb-3">
                    Contact Me
                </h3>

                <form>

                    <div class="mb-3">
                        <input
                            type="text"
                            class="form-control"
                            placeholder="Your Name"
                        >
                    </div>

                    <div class="mb-3">
                        <input
                            type="email"
                            class="form-control"
                            placeholder="Your Email"
                        >
                    </div>

                    <div class="mb-3">
                        <textarea
                            class="form-control"
                            rows="4"
                            placeholder="Your Message"
                        ></textarea>
                    </div>

                    <button type="submit" class="btn btn-dark">
                        Send Message
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3 mt-4">
        <p class="mb-0">
            © 2026 Ayushi | Personal Portfolio
        </p>
    </footer>

</body>

</html>
