```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Styled Button Collection</h1>
        <p>Different button styles using CSS</p>
    </header>

    <main>
        <section class="button-container">

            <!-- Primary button -->
            <button class="btn primary">
                Primary Button
            </button>

            <!-- Secondary button -->
            <button class="btn secondary">
                Secondary Button
            </button>

            <!-- Outline button -->
            <button class="btn outline">
                Outline Button
            </button>

            <!-- Focus button -->
            <button class="btn focus-button">
                Focus Button
            </button>

            <!-- Disabled button -->
            <button class="btn disabled-button" disabled>
                Disabled Button
            </button>

        </section>
    </main>

    <footer>
        <p>Button Collection using CSS Pseudo-Classes</p>
    </footer>

</body>
</html>
```
