<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Move your mouse over the elements</p>
    </header>

    <main>
        <section class="tooltip-container">

            <!-- Tooltip 1 -->
            <div class="tooltip">
                <span>Home</span>
                <div class="tooltip-text">Go to Home</div>
            </div>

            <!-- Tooltip 2 -->
            <div class="tooltip">
                <span>Profile</span>
                <div class="tooltip-text">View Profile</div>
            </div>

            <!-- Tooltip 3 -->
            <div class="tooltip">
                <span>Settings</span>
                <div class="tooltip-text">Open Settings</div>
            </div>

            <!-- Tooltip 4 -->
            <div class="tooltip">
                <span>Contact</span>
                <div class="tooltip-text">Contact Us</div>
            </div>

        </section>
    </main>

    <footer>
        <p>Tooltips created using only CSS</p>
    </footer>

</body>
</html>
