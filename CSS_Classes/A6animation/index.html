```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CSS Animation Demonstration</h1>
        <p>Different animations using @keyframes</p>
    </header>

    <main>
        <section class="animation-container">

            <!-- Moving Box -->
            <div class="animation-box">
                <h2>Moving Box</h2>
                <div class="moving-box"></div>
            </div>

            <!-- Bouncing Ball -->
            <div class="animation-box">
                <h2>Bouncing Ball</h2>
                <div class="ball"></div>
            </div>

            <!-- Color Changing Text -->
            <div class="animation-box">
                <h2 class="color-text">Color Changing</h2>
                <p>CSS Animation</p>
            </div>

        </section>
    </main>

    <footer>
        <p>CSS Animations using @keyframes</p>
    </footer>

</body>
</html>
```
