```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Combined CSS Effects</h1>
        <p>Hover, transition and transformation effects</p>
    </header>

    <main>

        <section class="effects-container">

            <!-- Effect 1 -->
            <article class="effect-card">
                <h2>Grow Effect</h2>

                <button class="effect-button grow-button">
                    Hover Me
                </button>

                <p>
                    Button grows using transform: scale().
                </p>
            </article>

            <!-- Effect 2 -->
            <article class="effect-card">
                <h2>Color Effect</h2>

                <button class="effect-button color-button">
                    Hover Me
                </button>

                <p>
                    Button changes its background color.
                </p>
            </article>

            <!-- Effect 3 -->
            <article class="effect-card">
                <h2>Lift Effect</h2>

                <button class="effect-button lift-button">
                    Hover Me
                </button>

                <p>
                    Button moves upward using translateY().
                </p>
            </article>

        </section>

    </main>

    <footer>
        <p>Combined CSS Effects Demonstration</p>
    </footer>

</body>
</html>
```
