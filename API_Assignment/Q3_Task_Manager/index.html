<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager</title><link rel="stylesheet" href="style.css"><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script defer src="script.js"></script></head><body><main class="container"><header><small>QUESTION 03 · JQUERY AJAX + QUERY PARAMS</small><h1>My tasks</h1><p>Filter tasks and mark them complete.</p></header><section class="panel"><div class="toolbar"><label for="filter">Filter tasks</label><select id="filter"><option value="all">All tasks</option><option value="Low">Low Priority</option><option value="Medium">Medium Priority</option><option value="High">High Priority</option><option value="completed">Completed</option></select></div><p id="loading" hidden>Loading tasks...</p><p id="error" class="error" hidden>Could not load tasks. Start JSON Server on port 3003.</p><p id="empty" hidden>No tasks found for this filter.</p><ul id="taskList"></ul></section></main></body></html>
