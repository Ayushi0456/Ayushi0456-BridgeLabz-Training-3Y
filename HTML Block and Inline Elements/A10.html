<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection</title>
</head>
<body>

    <h1>Choose Your Travel Destination</h1>

    <label>Country:</label>
    <select>
        <option selected>India</option>
        <option>USA</option>
        <option>Japan</option>
        <option>France</option>
    </select>

    <br><br>

    <label>State:</label>
    <select>
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Goa</option>
        <option>Kerala</option>
    </select>

    <br><br>

    <label>City:</label>
    <select>
        <option selected>Agra</option>
        <option>Jaipur</option>
        <option>Goa</option>
        <option>Kochi</option>
    </select>

    <br><br>

    <label>Favorite Tourist Place:</label>
    <select>
        <option selected>Taj Mahal</option>
        <option>Amer Fort</option>
        <option>Goa Beach</option>
        <option>Munnar</option>
    </select>

    <p>
        My choices are: India, Uttar Pradesh, Agra, and Taj Mahal.
    </p>

</body>
</html>
