<!DOCTYPE html>
<html>
<head>
    <title>Product Catalog</title>
</head>
<body>

            <th colspan="2">Product</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/100" alt="Laptop">
            </td>
            <td>Laptop</td>
            <td>High-performance laptop</td>
            <td>₹50,000</td>

        <tr>
            <td>
                <img src="https://via.placeholder.com/100" alt="Headphones">
            </td>
            <td>Headphones</td>
            <td>Wireless headphones</td>
            <td>₹2,000</td>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/100" alt="Keyboard">
            </td>
            <td>Keyboard</td>
            <td>Mechanical keyboard</td>
            <td>₹1,500</td>
            <td>Out of Stock</td>
        </tr>

</body>
</html>
