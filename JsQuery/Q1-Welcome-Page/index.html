
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f0f4ff;
            padding: 40px;
        }

        button {
            padding: 10px 18px;
            margin: 10px;
            cursor: pointer;
            background: #34495e;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #greeting {
            color: #2563eb;
            font-size: 28px;
        }

        #welcomeMessage {
            background: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to Our Website</h1>
    </header>

    <main>
        <h2 id="greeting">Hello Visitor!</h2>

        <section id="welcomeMessage">
            <h3>Welcome Message</h3>
            <p>We are happy to have you here. Have a wonderful day!</p>
        </section>

        <button id="changeGreeting">Change Greeting</button>
        <button id="toggleWelcome">Toggle Welcome Message</button>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
