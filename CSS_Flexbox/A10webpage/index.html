<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            My Website
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <!-- Main Grid -->
    <main>

        <!-- Article -->
        <article>

            <h1>Welcome to My Website</h1>

            <div class="boxes">

                <div class="box">
                    <h2>HTML</h2>
                    <p>HTML creates the structure of a webpage.</p>
                </div>

                <div class="box">
                    <h2>CSS</h2>
                    <p>CSS is used to design webpages.</p>
                </div>

                <div class="box">
                    <h2>Flexbox</h2>
                    <p>Flexbox helps create flexible layouts.</p>
                </div>

            </div>

        </article>

        <!-- Sidebar -->
        <aside>
            <h2>Sidebar</h2>

            <p>
                This is the sidebar of the webpage.
            </p>
        </aside>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
