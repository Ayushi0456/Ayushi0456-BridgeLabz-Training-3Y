<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Shadows & Depth Effects</h1>
        <p>Hover over the cards to see the effect</p>
    </header>

    <main>

        <!-- Cards Section -->
        <section class="card-container">

            <!-- Card 1 -->
            <article class="card shadow-one">
                <h2>Card One</h2>
                <p>
                    This card uses a soft box-shadow
                    to create a simple depth effect.
                </p>
            </article>

            <!-- Card 2 -->
            <article class="card shadow-two">
                <h2>Card Two</h2>
                <p>
                    This card uses a stronger shadow
                    with more distance.
                </p>
            </article>

            <!-- Card 3 -->
            <article class="card shadow-three">
                <h2>Card Three</h2>
                <p>
                    This card uses multiple shadow
                    layers for extra depth.
                </p>
            </article>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>CSS Shadow Practice</p>
    </footer>

</body>
</html>
