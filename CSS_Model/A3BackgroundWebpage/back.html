<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fixed Header -->
    <header>
        <h1>CSS Gradient Showcase</h1>
    </header>

    <main>

        <!-- Linear Gradient Section -->
        <section class="linear-section">
            <div class="content">
                <h2>Linear Gradient</h2>
                <p>
                    This section uses a linear gradient.
                    The colors change in a straight direction.
                </p>
            </div>
        </section>

        <!-- Radial Gradient Section -->
        <section class="radial-section">
            <div class="content">
                <h2>Radial Gradient</h2>
                <p>
                    This section uses a radial gradient.
                    The colors spread outward from the center.
                </p>
            </div>
        </section>

    </main>

    <!-- Fixed Footer -->
    <footer>
        <p>Gradient Background Practice</p>
    </footer>

</body>
</html>
