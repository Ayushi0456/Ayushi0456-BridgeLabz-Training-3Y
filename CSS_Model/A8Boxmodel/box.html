<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CSS Box Model</h1>
        <p>Content, Padding, Border and Margin</p>
    </header>

    <main>

        <!-- Box Model Demonstration -->
        <section class="box-model-section">

            <div class="margin-layer">

                <div class="border-layer">

                    <div class="padding-layer">

                        <div class="content-layer">
                            Content
                        </div>

                    </div>

                </div>

            </div>

            <!-- Description -->
            <div class="description">

                <p>
                    <strong>Content:</strong>
                    Actual text or element content.
                </p>

                <p>
                    <strong>Padding:</strong>
                    Space between content and border.
                </p>

                <p>
                    <strong>Border:</strong>
                    Line surrounding the padding.
                </p>

                <p>
                    <strong>Margin:</strong>
                    Space outside the border.
                </p>

            </div>

        </section>

        <!-- Box sizing comparison -->
        <section class="comparison">

            <h2>Box-Sizing Comparison</h2>

            <div class="comparison-container">

                <div class="default-box">
                    Default Box-Sizing
                </div>

                <div class="border-box">
                    Border-Box
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>Box Model Practice</p>
    </footer>

</body>
</html>
