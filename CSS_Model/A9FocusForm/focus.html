<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Outline & Focus Styling</h1>
        <p>Click inside the fields to see the focus effect</p>
    </header>

    <main>

        <section class="form-section">

            <form>

                <!-- Name -->
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >

                <!-- Email -->
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

                <!-- Message -->
                <label for="message">Message</label>

                <textarea
                    id="message"
                    rows="5"
                    placeholder="Write your message"
                ></textarea>

                <!-- Submit -->
                <button type="submit">
                    Submit
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>Outline and Focus Form Practice</p>
    </footer>

</body>
</html>
