<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CSS Transformations</h1>
        <p>Hover over each box to see the transformation</p>
    </header>

    <main>

        <section class="transform-container">

            <!-- Rotate -->
            <article class="transform-item">
                <div class="box rotate">Rotate</div>
                <p>rotate()</p>
            </article>

            <!-- Scale -->
            <article class="transform-item">
                <div class="box scale">Scale</div>
                <p>scale()</p>
            </article>

            <!-- Translate -->
            <article class="transform-item">
                <div class="box translate">Translate</div>
                <p>translate()</p>
            </article>

            <!-- Skew -->
            <article class="transform-item">
                <div class="box skew">Skew</div>
                <p>skew()</p>
            </article>

        </section>

    </main>

    <footer>
        <p>CSS Transform Practice</p>
    </footer>

</body>
</html>
