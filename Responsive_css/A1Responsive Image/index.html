<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Responsive Image Filter Gallery</h1>

    <div class="gallery">

        <div class="image-box">
            <img class="blur" src="https://picsum.photos/id/1015/400/300" alt="Mountain">
            <p>Blur Filter</p>
        </div>

        <div class="image-box">
            <img class="grayscale" src="https://picsum.photos/id/1011/400/300" alt="Nature">
            <p>Grayscale Filter</p>
        </div>

        <div class="image-box">
            <img class="sepia" src="https://picsum.photos/id/1016/400/300" alt="Forest">
            <p>Sepia Filter</p>
        </div>

        <div class="image-box">
            <img class="brightness" src="https://picsum.photos/id/1025/400/300" alt="Dog">
            <p>Brightness Filter</p>
        </div>

        <div class="image-box">
            <img class="contrast" src="https://picsum.photos/id/1024/400/300" alt="Animal">
            <p>Contrast Filter</p>
        </div>

        <div class="image-box">
            <img class="hue" src="https://picsum.photos/id/1035/400/300" alt="River">
            <p>Hue Rotate Filter</p>
        </div>

    </div>

</body>
</html>
